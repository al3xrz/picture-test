<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" font-family="Segoe UI, Roboto, sans-serif">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#6366F1"/>
    </marker>
    <marker id="arrowGray" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#94A3B8"/>
    </marker>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="front" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="back" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4F46E5"/>
    </linearGradient>
    <linearGradient id="data" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="760" fill="url(#bg)" rx="16"/>
  <text x="500" y="46" text-anchor="middle" fill="#F8FAFC" font-size="26" font-weight="700">Picture Test — архитектура приложения</text>
  <text x="500" y="72" text-anchor="middle" fill="#94A3B8" font-size="14">SPA (React) → nginx → FastAPI → SQLite / uploads</text>

  <!-- Browser -->
  <rect x="60" y="120" width="160" height="90" rx="12" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
  <text x="140" y="158" text-anchor="middle" fill="#E2E8F0" font-size="15" font-weight="600">Браузер</text>
  <text x="140" y="182" text-anchor="middle" fill="#94A3B8" font-size="12">карточки, квиз, админка</text>

  <!-- nginx / frontend -->
  <rect x="320" y="110" width="330" height="110" rx="14" fill="#1E293B" stroke="#3B82F6" stroke-width="2"/>
  <rect x="320" y="110" width="330" height="34" rx="14" fill="url(#front)"/>
  <rect x="320" y="130" width="330" height="14" fill="url(#front)"/>
  <text x="485" y="133" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="700">Frontend — nginx / Vite</text>
  <text x="340" y="168" fill="#CBD5E1" font-size="13">• React 18 SPA (Vite build)</text>
  <text x="340" y="190" fill="#CBD5E1" font-size="13">• прокси /api/ и /uploads/ → backend:8000</text>
  <text x="340" y="210" fill="#94A3B8" font-size="12">MUI v6 · React Router · axios</text>

  <!-- Backend -->
  <rect x="320" y="300" width="330" height="150" rx="14" fill="#1E293B" stroke="#6366F1" stroke-width="2"/>
  <rect x="320" y="300" width="330" height="34" rx="14" fill="url(#back)"/>
  <rect x="320" y="320" width="330" height="14" fill="url(#back)"/>
  <text x="485" y="323" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="700">Backend — FastAPI</text>
  <text x="340" y="360" fill="#CBD5E1" font-size="13">• /api/quiz — публичные эндпоинты</text>
  <text x="340" y="382" fill="#CBD5E1" font-size="13">• /api/admin — CRUD под HTTP Basic</text>
  <text x="340" y="404" fill="#CBD5E1" font-size="13">• SQLAlchemy 2.0 ORM</text>
  <text x="340" y="426" fill="#CBD5E1" font-size="13">• StaticFiles /uploads · CORS · /api/health</text>

  <!-- Data -->
  <rect x="320" y="540" width="330" height="130" rx="14" fill="#1E293B" stroke="#10B981" stroke-width="2"/>
  <rect x="320" y="540" width="330" height="34" rx="14" fill="url(#data)"/>
  <rect x="320" y="560" width="330" height="14" fill="url(#data)"/>
  <text x="485" y="563" text-anchor="middle" fill="#FFFFFF" font-size="15" font-weight="700">Хранилище (volume /data)</text>
  <text x="340" y="602" fill="#CBD5E1" font-size="13">• app.db — SQLite (questions, options)</text>
  <text x="340" y="624" fill="#CBD5E1" font-size="13">• uploads/ — изображения вопросов</text>
  <text x="340" y="650" fill="#94A3B8" font-size="12">каскадное удаление вопрос → варианты + файл</text>

  <!-- arrows -->
  <line x1="220" y1="165" x2="314" y2="165" stroke="#6366F1" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="485" y1="220" x2="485" y2="294" stroke="#6366F1" stroke-width="2.5" marker-end="url(#arrow)"/>
  <line x1="485" y1="450" x2="485" y2="534" stroke="#10B981" stroke-width="2.5" marker-end="url(#arrowGray)"/>

  <!-- side notes -->
  <rect x="720" y="300" width="230" height="88" rx="12" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
  <text x="835" y="330" text-anchor="middle" fill="#E2E8F0" font-size="14" font-weight="600">Модель данных</text>
  <text x="738" y="355" fill="#94A3B8" font-size="12">questions: id, image_url,</text>
  <text x="738" y="374" fill="#94A3B8" font-size="12">position, created_at</text>

  <rect x="720" y="410" width="230" height="88" rx="12" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
  <text x="835" y="440" text-anchor="middle" fill="#E2E8F0" font-size="14" font-weight="600">options</text>
  <text x="738" y="465" fill="#94A3B8" font-size="12">id, question_id (FK),</text>
  <text x="738" y="484" fill="#94A3B8" font-size="12">text, is_correct, position</text>

  <rect x="60" y="300" width="200" height="150" rx="12" fill="#1E293B" stroke="#475569" stroke-width="1.5"/>
  <text x="160" y="330" text-anchor="middle" fill="#E2E8F0" font-size="14" font-weight="600">Правила</text>
  <text x="78" y="356" fill="#94A3B8" font-size="12">≥ 2 варианта</text>
  <text x="78" y="377" fill="#94A3B8" font-size="12">ровно 1 верный</text>
  <text x="78" y="398" fill="#94A3B8" font-size="12">результаты не пишутся</text>
  <text x="78" y="419" fill="#94A3B8" font-size="12">публичная часть анонимна</text>

  <text x="500" y="730" text-anchor="middle" fill="#64748B" font-size="12">Документация: docs/ARCHITECTURE.md</text>
</svg>
